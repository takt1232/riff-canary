name: Windows build

# Builds a portable Canary.exe (no installer, runs from anywhere) and publishes it to the
# rolling "windows-latest" release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'ios/**', 'android/**', 'site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build portable exe
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node tools/build-info.mjs build-info.js windows
          npx electron-builder --win portable --x64 --publish never -c.artifactName='Canary.${ext}'
          ls -la dist
          cp dist/Canary.exe Canary.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Canary-exe
          path: Canary.exe

      - name: Publish to the windows-latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only the newest commit on main replaces the public build (a re-run of an older run would
          # otherwise put an older build back)
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at ${head::7} now; not publishing ${GITHUB_SHA::7}"; exit 0; fi
          # downloads so far, kept across builds (GitHub resets the count when the file is replaced; the
          # website adds this to the new file's count). 0 = Canary starts counting from scratch
          before="$(bash .github/carry-downloads.sh windows-latest Canary.exe 0)"
          ver="$(node -p "require('./package.json').version")"
          gh release delete windows-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create windows-latest Canary.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Canary for Windows (latest build)" \
            --notes "Canary $ver. Portable build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). No install needed: download Canary.exe and run it. Windows SmartScreen may warn because the exe is unsigned: More info -> Run anyway.<!-- canary-downloads-before: $before --><!-- canary-version: $ver -->"
